<script>
const D = JSON.parse(document.getElementById('data').textContent);
const W = '日一二三四五六';
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function today() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function days(a, b) { return Math.round((Date.parse(b + 'T00:00:00') - Date.parse(a + 'T00:00:00')) / 864e5); }
function md(s) { const d = new Date(s + 'T00:00:00'); return `${d.getMonth()+1}/${d.getDate()}`; }
function mdw(s) { const d = new Date(s + 'T00:00:00'); return `${d.getMonth()+1}/${d.getDate()}（${W[d.getDay()]}）`; }
function range(t) { return t.start === t.end ? mdw(t.start) : `${md(t.start)}–${md(t.end)}`; }
function state(t, now) {
  if (t.done) return {cls: 'done', txt: '已完成'};
  if (now > t.end) return {cls: 'late', txt: `逾期 ${days(t.end, now)} 天`};
  if (now >= t.start) {
    const left = days(now, t.end);
    return {cls: 'now', txt: left === 0 ? '今天截止' : `進行中，還剩 ${left} 天`};
  }
  const n = days(now, t.start);
  return {cls: n <= 3 ? 'soon' : '', txt: n === 1 ? '明天開始' : `${n} 天後開始`};
}
function item(t, now) {
  const s = state(t, now);
  const oi = D.contacts.findIndex(c => c.nick === t.owner);
  return `<li class="task ${oi < 0 ? '' : 'o' + oi % 3} k-${esc(t.kind)} ${s.cls}"><div class="l1"><span class="d num">${range(t)}</span>` +
    `<span class="ow">${esc(t.owner)}</span><span class="st">${s.txt}</span></div>` +
    `<div class="it">${esc(t.item)}</div>${t.note ? `<div class="nt">${esc(t.note)}</div>` : ''}</li>`;
}
function list(ts, now, emptyTxt) {
  return ts.length ? `<ul class="tasks">${ts.map(t => item(t, now)).join('')}</ul>` : `<div class="empty">${emptyTxt}</div>`;
}
function renderNow(now) {
  let h = '';
  const toOpen = days(now, D.eventDate);
  if (now < D.eventDate) {
    h += `<div class="card evt"><div class="big num">${toOpen}<small>天後開幕</small></div>` +
      `<div class="sub">${esc(D.eventName)}：${mdw(D.eventDate)} 到 ${mdw(D.eventEnd)}</div></div>`;
  } else if (now <= D.eventEnd) {
    h += `<div class="card evt"><div class="big">活動第 ${days(D.eventDate, now) + 1} 天</div>` +
      `<div class="sub">${esc(D.eventName)}：${mdw(D.eventDate)} 到 ${mdw(D.eventEnd)}</div></div>`;
  } else {
    h += `<div class="card evt"><div class="big">活動已於 ${md(D.eventEnd)} 結束</div></div>`;
  }
  const open = D.tasks.filter(t => !t.done);
  const dl = open.filter(t => t.kind === '截止' && t.end >= now)[0];
  if (dl) {
    const n = days(now, dl.end);
    h += `<div class="card dl"><div class="k">下一個截止</div><div class="big num">${mdw(dl.end)}<small>${n === 0 ? '就是今天' : `還有 ${n} 天`}</small></div>` +
      `<div class="it">${esc(dl.item)}（${esc(dl.owner)}）</div><div class="nt">${esc(dl.note)}</div></div>`;
  }
  const late = open.filter(t => now > t.end);
  if (late.length) h += `<h2>逾期未完成<span class="n">${late.length} 項</span></h2>` + list(late, now, '');
  const cur = open.filter(t => t.start <= now && now <= t.end);
  h += `<h2>進行中<span class="n">${cur.length} 項</span></h2>` + list(cur, now, '今天沒有進行中的工作。');
  const soon = open.filter(t => t.start > now && days(now, t.start) <= 14);
  h += `<h2>兩週內開始<span class="n">${soon.length} 項</span></h2>` + list(soon, now, '未來兩週沒有要開始的工作。');
  document.getElementById('now').innerHTML = h;
}
let who = '';
function renderAll(now) {
  const owners = [...new Set(D.tasks.map(t => t.owner))];
  let h = `<div class="ctl"><select id="who" aria-label="負責人"><option value="">全部負責人</option>` +
    owners.map(o => `<option value="${esc(o)}"${o === who ? ' selected' : ''}>${esc(o)}</option>`).join('') +
    `</select><button type="button" id="jump">跳到今天</button></div>`;
  let month = '', marked = false;
  for (const t of D.tasks.filter(t => !who || t.owner === who)) {
    if (!marked && t.start > now) { h += '<div class="today-line" id="todayline">今天</div>'; marked = true; }
    const m = t.start.slice(0, 7);
    if (m !== month) { month = m; h += `<div class="month">${+m.slice(5)} 月</div>`; }
    h += `<ul class="tasks">${item(t, now)}</ul>`;
  }
  if (!marked) h += '<div class="today-line" id="todayline">今天</div>';
  if (D.rules.length) h += `<h2>排程規則</h2><ul class="rules">${D.rules.map(r => `<li>${esc(r)}</li>`).join('')}</ul>`;
  const el = document.getElementById('all');
  el.innerHTML = h;
  el.querySelector('#who').onchange = e => { who = e.target.value; renderAll(today()); };
  el.querySelector('#jump').onclick = () => document.getElementById('todayline').scrollIntoView({block: 'center'});
}
function renderTel() {
  document.getElementById('tel').innerHTML = `<ul class="tel">${D.contacts.map(c =>
    `<li><div class="nick">${esc(c.nick)}</div><div class="note">${esc(c.role)}</div>` +
    (c.tel ? `<a class="call num" href="tel:${esc(c.tel)}">撥打 ${esc(c.phone)}</a>` : '<div class="nophone">電話未提供</div>') +
    '</li>').join('')}</ul>`;
}
function tick() {
  const d = new Date(), now = today();
  document.getElementById('clock').textContent = `${d.getMonth()+1}/${d.getDate()}（${W[d.getDay()]}）`;
  if (tick.last !== now) { tick.last = now; renderNow(now); renderAll(now); }
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-current', x === b ? 'page' : 'false'));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === b.dataset.v));
  window.scrollTo(0, 0);
});
renderTel(); tick(); setInterval(tick, 30000);
</script>
